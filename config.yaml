# Project-wide configuration.
# Copy to config.local.yaml for machine-specific paths; config.local.yaml is git-ignored.

project:
  name: "AI-Enabled Smart EV Charging and Energy Management Platform"
  supervisor: "Dr Amer Ghias"
  # Display timezone for SP4 only. Calendar features, the local-hour pattern
  # analysis and the forecast-origin anchor use each dataset's OWN timezone
  # (datasets.yaml) — never this value. Storage is always UTC.
  timezone_display: "America/Denver"

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  resolution: "1h"                    # LOCKED at kickoff
  currency: "CNY"                     # see docs/integration-contract.md amendment A1
  region: "CN"                        # datasets are China-specific

# Sub-project 1 — demand forecasting
sp1:
  dataset: ""                         # key in subprojects/sp1-data-forecasting/config/datasets.yaml
  model: ""                           # linear | random-forest | lstm | xgboost | "" = pick best WAPE
  forecast_horizon_hours: 24          # day-ahead horizon
  forecast_days: 30                   # length of the window written to the contract files
  backtest_min_train_days: 14         # history required before the first forecast origin
  train_window_days: 365              # training history cap per origin (0 = use everything)
  max_charging_power_kw: 7.0          # per-vehicle power used for the "uncontrolled" baseline
  plug_in_hour_local: 18              # local hour every EV plugs in, for that baseline
  random_seed: 42

# Sub-project 2 — smart charging scheduling
sp2:
  strategy: ""                        # tou | optimised
  algorithm: ""                       # lp | ga | heuristic
  max_charging_power_kw: 7.0
  n_evs_scenario: 50                  # the supervisor's headline scenario

# Sub-project 3 — renewable-aware charging
sp3:
  solar_dataset: ""                   # China-specific: see data/README.md

# Sub-project 4 — monitoring & visualisation
sp4:
  stack: ""                           # dash | streamlit | react
  database_url: ""                    # e.g. sqlite:///data/interim/app.db
  refresh_seconds: 60

# Sub-project 5 — assessment
sp5:
  baseline_scenario: "uncontrolled"
  carbon_intensity_source: ""         # China-specific grid carbon intensity
